site_name: AI 算法与工程学习笔记
site_description: 算法基础、机器学习、推荐搜索广告、大模型、多模态与工程实践
site_author: GlenTT
site_url: https://gritjw.github.io/hot_100/

# =====================
# 主题配置
# =====================
theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode

# =====================
# 插件
# =====================
plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true

# =====================
# Markdown 扩展
# =====================
markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
      toc_depth: 2 # 核心：只显示到二级标题
  - md_in_html

# =====================
# 自定义样式
# =====================
extra_css:
  - stylesheets/extra.css

# =====================
# 数学公式支持
# =====================
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# =====================
# 导航结构
# =====================
