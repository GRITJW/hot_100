function showDetail(key) {
  const d = data[key];
  const badgeClass = 'badge-' + d.type;
  const panel = document.getElementById('detail-panel');
  const related = d.related.map(r => `<span class="link-tag" onclick="sendPrompt('请详解算法题型：${r}')">${r} ↗</span>`).join('');
  panel.innerHTML = `
    <div class="detail-title">${d.title}</div>
    <span class="detail-badge ${badgeClass}">${d.badge}</span>
    <div class="detail-core">${d.core}</div>
    <div class="detail-section">核心套路 / 框架</div>
    <pre style="font-family:var(--font-mono);font-size:11px;color:var(--color-text-secondary);background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:6px;padding:10px;overflow-x:auto;line-height:1.6;margin:0 0 8px;">${d.template}</pre>
    <div class="detail-section">常见题型模式</div>
    <ul class="detail-list">${d.patterns.map(p=>`<li>${p}</li>`).join('')}</ul>
    <div class="detail-section">关联题型（可联动学习）</div>
    <div class="links-row">${related}</div>
    <div class="detail-section" style="margin-top:10px">代表题目</div>
    <div style="font-size:12px;color:var(--color-text-tertiary);">${d.example}</div>
  `;
  document.querySelectorAll('.tag').forEach(t => t.classList.remove('active-tag'));
  event.target.classList.add('active-tag');
}
</script>
