<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>算法刷题分类体系</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f5f4f0;
  color: #1a1a18;
  padding: 24px 16px 48px;
  min-height: 100vh;
}
:root {
  --color-background-primary: #ffffff;
  --color-background-secondary: #f1efe8;
  --color-text-primary: #1a1a18;
  --color-text-secondary: #5f5e5a;
  --color-text-tertiary: #888780;
  --color-border-primary: rgba(0,0,0,0.4);
  --color-border-secondary: rgba(0,0,0,0.3);
  --color-border-tertiary: rgba(0,0,0,0.15);
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --font-mono: "SF Mono", "Fira Code", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  body { background: #1c1c1a; color: #d4d2c8; }
  :root {
    --color-background-primary: #2c2c2a;
    --color-background-secondary: #242422;
    --color-text-primary: #d4d2c8;
    --color-text-secondary: #9c9a92;
    --color-text-tertiary: #6a6860;
    --color-border-primary: rgba(255,255,255,0.4);
    --color-border-secondary: rgba(255,255,255,0.3);
    --color-border-tertiary: rgba(255,255,255,0.15);
  }
}
.root { max-width: 720px; margin: 0 auto; }
.top-banner { text-align: center; margin-bottom: 1.5rem; }
.top-banner h2 { font-size: 18px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 4px; }
.top-banner p { font-size: 13px; color: var(--color-text-secondary); }
.meta-card { border-radius: var(--border-radius-lg); border: 0.5px solid var(--color-border-secondary); padding: 12px 14px; background: var(--color-background-secondary); cursor: default; }
.divider { height: 0.5px; background: var(--color-border-tertiary); margin: 14px 0; }
.section-header { font-size: 12px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 8px; letter-spacing: 0.03em; text-transform: uppercase; }
.tags-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tag { font-size: 12px; padding: 4px 12px; border-radius: 20px; border: 0.5px solid; cursor: pointer; transition: all 0.15s; user-select: none; }
.tag:hover { opacity: 0.75; }
.tag.ds    { background: #E6F1FB; color: #0C447C; border-color: #B5D4F4; }
.tag.algo  { background: #E1F5EE; color: #085041; border-color: #9FE1CB; }
.tag.adv   { background: #FAEEDA; color: #633806; border-color: #FAC775; }
.tag.active-tag { font-weight: 600; box-shadow: 0 0 0 2px currentColor; }
.detail-panel {
  background: var(--color-background-secondary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-lg);
  padding: 16px;
  min-height: 200px;
}
.detail-title { font-size: 16px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 6px; }
.detail-badge { display: inline-block; font-size: 10px; padding: 2px 10px; border-radius: 10px; margin-bottom: 12px; }
.badge-ds   { background: #E6F1FB; color: #185FA5; }
.badge-algo { background: #E1F5EE; color: #0F6E56; }
.badge-adv  { background: #FAEEDA; color: #854F0B; }
.detail-core { font-size: 13px; color: var(--color-text-primary); line-height: 1.7; margin-bottom: 12px; }
.detail-section { font-size: 11px; font-weight: 600; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.04em; margin: 12px 0 5px; }
.detail-list { list-style: none; }
.detail-list li { font-size: 12px; color: var(--color-text-secondary); padding: 3px 0; display: flex; gap: 6px; }
.detail-list li::before { content: "·"; color: var(--color-text-tertiary); flex-shrink: 0; }
.links-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.link-tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); color: var(--color-text-secondary); cursor: default; }
.principle-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.principle-card { background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 12px; }
.principle-icon { font-size: 18px; margin-bottom: 5px; }
.principle-title { font-size: 13px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 4px; }
.principle-desc { font-size: 11px; color: var(--color-text-secondary); line-height: 1.5; }
pre {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--color-text-secondary);
  background: var(--color-background-primary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: 6px;
  padding: 12px;
  overflow-x: auto;
  line-height: 1.7;
  margin: 0 0 8px;
  white-space: pre;
}
.placeholder { display: flex; align-items: center; justify-content: center; height: 160px; color: var(--color-text-tertiary); font-size: 13px; }
</style>
</head>
<body>
<div class="root">
  <div class="top-banner">
    <h2>算法刷题分类体系</h2>
    <p>三层结构 · 点击任意标签查看详解与题型联系</p>
  </div>

  <div class="principle-row">
    <div class="principle-card">
      <div class="principle-icon">🗂</div>
      <div class="principle-title">数据结构类</div>
      <div class="principle-desc">问题的"形状"，决定你用什么容器装数据</div>
    </div>
    <div class="principle-card">
      <div class="principle-icon">💡</div>
      <div class="principle-title">算法思想类</div>
      <div class="principle-desc">问题的"解法策略"，决定你用什么方式搜索答案</div>
    </div>
    <div class="principle-card">
      <div class="principle-icon">⚡</div>
      <div class="principle-title">高级技巧类</div>
      <div class="principle-desc">在前两类基础上的优化或特殊变体</div>
    </div>
  </div>

  <div class="section-header">数据结构类</div>
  <div class="tags-row">
    <span class="tag ds" onclick="showDetail('array',this)">数组</span>
    <span class="tag ds" onclick="showDetail('linkedlist',this)">链表</span>
    <span class="tag ds" onclick="showDetail('stack',this)">栈</span>
    <span class="tag ds" onclick="showDetail('queue',this)">队列</span>
    <span class="tag ds" onclick="showDetail('hashmap',this)">哈希表</span>
    <span class="tag ds" onclick="showDetail('tree',this)">二叉树</span>
    <span class="tag ds" onclick="showDetail('graph',this)">图</span>
  </div>

  <div class="section-header">算法思想类</div>
  <div class="tags-row">
    <span class="tag algo" onclick="showDetail('twoptr',this)">双指针</span>
    <span class="tag algo" onclick="showDetail('sliding',this)">滑动窗口</span>
    <span class="tag algo" onclick="showDetail('binary',this)">二分查找</span>
    <span class="tag algo" onclick="showDetail('greedy',this)">贪心</span>
    <span class="tag algo" onclick="showDetail('dp',this)">动态规划</span>
    <span class="tag algo" onclick="showDetail('backtrack',this)">回溯</span>
    <span class="tag algo" onclick="showDetail('bfsdfs',this)">BFS / DFS</span>
    <span class="tag algo" onclick="showDetail('divcon',this)">分治</span>
    <span class="tag algo" onclick="showDetail('prefix',this)">前缀和</span>
    <span class="tag algo" onclick="showDetail('diff',this)">差分</span>
  </div>

  <div class="section-header">高级技巧类</div>
  <div class="tags-row">
    <span class="tag adv" onclick="showDetail('monotone',this)">单调栈 / 单调队列</span>
    <span class="tag adv" onclick="showDetail('binanswer',this)">二分答案</span>
    <span class="tag adv" onclick="showDetail('treedp',this)">树形DP</span>
    <span class="tag adv" onclick="showDetail('union',this)">并查集</span>
  </div>

  <div class="divider"></div>
  <div class="detail-panel" id="detail-panel">
    <div class="placeholder">← 点击上方任意标签，查看详细解析</div>
  </div>
</div>

<script>
const data = {
  array: {
    title: '数组', type: 'ds', badge: '数据结构',
    core: '最基础的线性结构。核心操作是通过下标 O(1) 随机访问。大多数其他题型（双指针、滑窗、前缀和）都建立在数组之上。',
    template: '# 遍历/暴力 O(n²) → 考虑哈希/双指针降为 O(n)\n# 原地修改（快慢指针）\n# 排序后双指针（Two Sum 变体）',
    patterns: ['遍历/暴力 O(n²) → 思考能否用哈希/双指针降为 O(n)', '原地修改（快慢指针）', '排序后双指针（Two Sum 变体）'],
    related: ['双指针', '滑动窗口', '前缀和', '差分', '二分查找'],
    example: 'LeetCode 1 Two Sum, 15 Three Sum, 283 Move Zeros'
  },
  linkedlist: {
    title: '链表', type: 'ds', badge: '数据结构',
    core: '节点指针构成的序列，插入/删除 O(1) 但无随机访问。核心技巧几乎全部基于"指针操作"。',
    template: '# 哑节点几乎是万能开头\ndummy = ListNode(0)\ndummy.next = head',
    patterns: ['快慢指针（找中点、判环）', '双指针（找倒数第 k 个）', '递归反转', '合并有序链表'],
    related: ['双指针', '递归/分治'],
    example: 'LeetCode 21 Merge Two Lists, 141 Detect Cycle, 206 Reverse'
  },
  stack: {
    title: '栈', type: 'ds', badge: '数据结构',
    core: 'LIFO 结构，适合处理"最近未处理的元素"。括号匹配、函数调用、单调栈都是栈的典型场景。',
    template: 'stack = []\nfor x in arr:\n    while stack and condition(stack[-1], x):\n        stack.pop()  # 单调栈核心\n    stack.append(x)',
    patterns: ['括号匹配（对称结构）', '递归转迭代', '单调栈（下一个更大/小元素）', '函数计算表达式'],
    related: ['单调栈', '回溯（隐式栈）'],
    example: 'LeetCode 20 Valid Parentheses, 84 Largest Rectangle, 739 Daily Temperatures'
  },
  queue: {
    title: '队列', type: 'ds', badge: '数据结构',
    core: 'FIFO 结构，BFS 的核心容器。单调队列用于滑动窗口最值问题。',
    template: 'from collections import deque\nq = deque([start])\nwhile q:\n    node = q.popleft()\n    for nb in neighbors(node):\n        if not visited:\n            q.append(nb)',
    patterns: ['BFS 层序遍历（最短路）', '优先队列（堆）用于 Dijkstra、Top K', '单调队列（窗口最值）'],
    related: ['BFS/DFS', '单调队列'],
    example: 'LeetCode 102 Binary Tree Level Order, 239 Sliding Window Maximum'
  },
  hashmap: {
    title: '哈希表', type: 'ds', badge: '数据结构',
    core: 'O(1) 查找。核心思想：用空间换时间。当需要"快速判断某元素是否存在"时，优先考虑哈希表。',
    template: '# 常见模式：先查后存\nfor i, x in enumerate(nums):\n    if target - x in seen:\n        return [seen[target-x], i]\n    seen[x] = i',
    patterns: ['Two Sum 类（存补数）', '频率统计（Counter）', '前缀和 + 哈希（子数组和）', '同构字符串'],
    related: ['前缀和', '滑动窗口'],
    example: 'LeetCode 1 Two Sum, 3 Longest Substring, 560 Subarray Sum Equals K'
  },
  tree: {
    title: '二叉树', type: 'ds', badge: '数据结构',
    core: '递归是树的天然语言。任何树题都问自己：根节点需要什么信息？从左/右子树返回什么？',
    template: 'def solve(root):\n    if not root: return base_case\n    left = solve(root.left)\n    right = solve(root.right)\n    return f(root.val, left, right)  # 后序位置',
    patterns: ['前/中/后序遍历（递归/迭代）', 'BST 的中序 = 有序数组', '路径问题（前序/后序结合）', '序列化/反序列化'],
    related: ['BFS/DFS', '动态规划（树形DP）', '二分查找（BST）'],
    example: 'LeetCode 104 Max Depth, 543 Diameter, 124 Max Path Sum'
  },
  graph: {
    title: '图', type: 'ds', badge: '数据结构',
    core: '图是树的泛化（树是特殊的无环图）。核心问题：遍历（BFS/DFS）、最短路、拓扑排序、连通性。',
    template: '# 邻接表建图\nfrom collections import defaultdict\ngraph = defaultdict(list)\nfor u, v in edges:\n    graph[u].append(v)\n    graph[v].append(u)',
    patterns: ['BFS 最短路（无权图）', 'Dijkstra 最短路（有权图）', '拓扑排序（有向无环图/课程表）', '并查集（连通分量）', 'DFS 判环'],
    related: ['BFS/DFS', '并查集', '动态规划（DAG 上DP）'],
    example: 'LeetCode 207 Course Schedule, 200 Number of Islands, 743 Network Delay'
  },
  twoptr: {
    title: '双指针', type: 'algo', badge: '算法思想',
    core: '用两个指针在数组/链表上移动，将 O(n²) 暴力降为 O(n)。前提：数组有序，或指针移动方向单调。',
    template: '# 对撞指针\nleft, right = 0, len(arr) - 1\nwhile left < right:\n    if condition:\n        left += 1\n    else:\n        right -= 1',
    patterns: ['对撞指针（Two Sum 有序版、盛水容器）', '快慢指针（链表判环、原地去重）', '同向指针（滑动窗口的底层实现）'],
    related: ['滑动窗口（是双指针的特化）', '链表', '数组'],
    example: 'LeetCode 11 Container With Most Water, 26 Remove Duplicates, 142 Linked List Cycle II'
  },
  sliding: {
    title: '滑动窗口', type: 'algo', badge: '算法思想',
    core: '双指针的特化：维护一个窗口 [left, right]，right 扩张、left 收缩，始终保持窗口合法。适用于"连续子数组/子串"问题。',
    template: 'left = 0\nfor right in range(len(s)):\n    window.add(s[right])      # 扩张\n    while window_invalid():   # 收缩\n        window.remove(s[left])\n        left += 1\n    ans = max(ans, right - left + 1)',
    patterns: ['最长满足条件的子串/子数组', '最短满足条件的子串', '固定长度窗口的统计'],
    related: ['双指针（是其父类）', '哈希表（维护窗口状态）'],
    example: 'LeetCode 3 Longest Substring, 76 Minimum Window Substring, 567 Permutation in String'
  },
  binary: {
    title: '二分查找', type: 'algo', badge: '算法思想',
    core: '在单调空间中通过不断折半缩小范围。关键：找到"单调性"。不只用于有序数组，凡是答案具有单调性，都可二分答案。',
    template: '# 通用左边界模板\nleft, right = lo, hi\nwhile left < right:\n    mid = (left + right) // 2\n    if check(mid):   # 满足条件\n        right = mid\n    else:\n        left = mid + 1',
    patterns: ['在排序数组中查找目标（经典）', '查找左/右边界（lower/upper bound）', '二分答案（最小化最大值、最大化最小值）', '旋转数组二分'],
    related: ['分治（理论归属）', '贪心（check 函数常用贪心验证）', '动态规划（可用二分优化部分DP）'],
    example: 'LeetCode 34 Find Range, 875 Koko Bananas, 1011 Ship Packages, 410 Split Array'
  },
  greedy: {
    title: '贪心', type: 'algo', badge: '算法思想',
    core: '每步做局部最优选择，期望全局最优。没有固定模板，需要证明局部最优 → 全局最优。与DP的区别：DP保存所有状态，贪心只保留一个。',
    template: '# 常见：排序 + 扫描\narr.sort(key=lambda x: ...)\nfor item in arr:\n    if can_take(item):\n        take(item)',
    patterns: ['区间问题（排序后扫描）', '跳跃游戏（局部可达 → 全局可达）', '任务调度', '哈夫曼编码思想'],
    related: ['二分查找（验证贪心策略）', '排序', '优先队列（堆贪心）'],
    example: 'LeetCode 55 Jump Game, 435 Non-overlapping Intervals, 452 Minimum Arrows'
  },
  dp: {
    title: '动态规划', type: 'algo', badge: '算法思想',
    core: '将大问题拆分为有重叠子问题的小问题，用记忆化避免重复计算。三要素：状态定义、转移方程、初始条件。',
    template: '# 一维DP模板\ndp = [0] * (n + 1)\ndp[0] = base_case\nfor i in range(1, n + 1):\n    dp[i] = f(dp[i-1], dp[i-2], ...)  # 状态转移',
    patterns: ['线性DP（最长子序列 LIS/LCS）', '背包问题（0-1/完全/分组）', '区间DP（矩阵链乘、戳气球）', '树形DP', '状压DP'],
    related: ['回溯（DP 的记忆化版本）', '贪心（有时可替代DP）', '二分查找（优化DP转移 O(nlogn) LIS）'],
    example: 'LeetCode 300 LIS, 322 Coin Change, 1143 LCS, 312 Burst Balloons'
  },
  backtrack: {
    title: '回溯', type: 'algo', badge: '算法思想',
    core: '在决策树上做 DFS，找所有满足条件的路径。与DP的区别：回溯枚举所有可能，不缓存（加缓存后变成DP）。剪枝是核心优化。',
    template: 'def backtrack(path, choices):\n    if end_condition:\n        result.append(path[:])\n        return\n    for choice in choices:\n        path.append(choice)    # 做选择\n        backtrack(path, next_choices)\n        path.pop()             # 撤销选择',
    patterns: ['排列（有顺序）', '组合（无顺序）', '子集', 'N皇后/数独（带约束的排列）', '单词搜索（在矩阵上回溯）'],
    related: ['DFS（回溯是带撤销的DFS）', '动态规划（记忆化回溯 = DP）'],
    example: 'LeetCode 46 Permutations, 78 Subsets, 39 Combination Sum, 51 N-Queens'
  },
  bfsdfs: {
    title: 'BFS / DFS', type: 'algo', badge: '算法思想',
    core: 'BFS：按层扩散，天然保证最短路（无权图），用队列。DFS：深入优先，适合遍历所有可能性，用栈/递归。两者是图/树遍历的两种顺序。',
    template: '# BFS\nfrom collections import deque\nq = deque([start]); visited = {start}\nwhile q:\n    node = q.popleft()\n    for nb in graph[node]:\n        if nb not in visited:\n            visited.add(nb)\n            q.append(nb)',
    patterns: ['BFS：最短路径数、最少操作步数、层序遍历', 'DFS：路径枚举、连通分量、拓扑排序', '双向BFS（优化搜索空间）'],
    related: ['图（应用场景）', '回溯（DFS + 撤销）', '树（DFS 天然对应递归）'],
    example: 'LeetCode 200 Islands, 127 Word Ladder (BFS), 130 Surrounded Regions (DFS)'
  },
  divcon: {
    title: '分治', type: 'algo', badge: '算法思想',
    core: '将问题拆为规模更小的同类子问题，递归解决后合并。时间复杂度用主定理分析。二分查找、归并排序都是分治。',
    template: 'def solve(arr, left, right):\n    if left >= right: return base\n    mid = (left + right) // 2\n    L = solve(arr, left, mid)\n    R = solve(arr, mid+
