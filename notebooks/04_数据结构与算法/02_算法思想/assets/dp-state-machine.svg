<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">股票状态机的基本转移与冷冻期状态拆分</title>
  <desc id="desc">上半部分展示前一天未持股和持股状态如何转移到当天状态；下半部分展示冷冻期需要把未持股拆分为刚卖出和可买入空仓。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <style>
      .title{font:700 32px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#0f172a}
      .panel-title{font:700 24px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#0f172a}
      .day{font:600 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#475569}
      .node-title{font:700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#0f172a}
      .node-code{font:16px Consolas,monospace;fill:#334155}
      .label{font:600 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#1d4ed8}
      .label-orange{font:600 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#c2410c}
      .note{font:17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#334155}
      .strong{font:700 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#0f172a}
      .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
      .node{fill:#fff;stroke:#2563eb;stroke-width:2.5}
      .node-orange{fill:#fff7ed;stroke:#ea580c;stroke-width:2.5}
      .edge{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#arrow-blue)}
      .edge-orange{fill:none;stroke:#ea580c;stroke-width:2.5;marker-end:url(#arrow-orange)}
    </style>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">状态机 DP：限制改变哪条转移？</text>

  <rect x="35" y="72" width="1130" height="315" rx="18" class="panel"/>
  <text x="65" y="110" class="panel-title">A. 无冷冻期：每天只需区分持股与未持股</text>
  <text x="250" y="145" text-anchor="middle" class="day">第 i-1 天结束</text>
  <text x="805" y="145" text-anchor="middle" class="day">第 i 天结束</text>

  <rect x="120" y="165" width="260" height="72" rx="12" class="node"/>
  <text x="250" y="194" text-anchor="middle" class="node-title">未持股</text>
  <text x="250" y="220" text-anchor="middle" class="node-code">cash[i-1]</text>
  <rect x="120" y="275" width="260" height="72" rx="12" class="node-orange"/>
  <text x="250" y="304" text-anchor="middle" class="node-title">持股</text>
  <text x="250" y="330" text-anchor="middle" class="node-code">hold[i-1]</text>

  <rect x="675" y="165" width="260" height="72" rx="12" class="node"/>
  <text x="805" y="194" text-anchor="middle" class="node-title">未持股</text>
  <text x="805" y="220" text-anchor="middle" class="node-code">cash[i]</text>
  <rect x="675" y="275" width="260" height="72" rx="12" class="node-orange"/>
  <text x="805" y="304" text-anchor="middle" class="node-title">持股</text>
  <text x="805" y="330" text-anchor="middle" class="node-code">hold[i]</text>

  <path d="M 380 188 C 480 160, 575 160, 675 188" class="edge"/>
  <text x="527" y="164" text-anchor="middle" class="label">不操作：+0</text>
  <path d="M 380 324 C 480 352, 575 352, 675 324" class="edge-orange"/>
  <text x="527" y="367" text-anchor="middle" class="label-orange">继续持有：+0</text>
  <path d="M 380 215 C 505 230, 550 288, 675 302" class="edge-orange"/>
  <text x="520" y="245" text-anchor="middle" class="label-orange">买入：−prices[i]</text>
  <path d="M 380 298 C 505 285, 550 225, 675 212" class="edge"/>
  <text x="525" y="292" text-anchor="middle" class="label">卖出：+prices[i]</text>

  <text x="970" y="190" class="note">手续费：</text>
  <text x="970" y="216" class="note">卖出边再减 fee</text>
  <text x="970" y="278" class="note">只交易一次：</text>
  <text x="970" y="304" class="note">买入从初始现金 0 出发</text>

  <rect x="35" y="410" width="1130" height="345" rx="18" class="panel"/>
  <text x="65" y="449" class="panel-title">B. 含冷冻期：未持股还要区分“刚卖出”与“可以买入”</text>
  <text x="245" y="486" text-anchor="middle" class="day">第 i-1 天结束</text>
  <text x="855" y="486" text-anchor="middle" class="day">第 i 天结束</text>

  <rect x="105" y="505" width="280" height="58" rx="11" class="node-orange"/>
  <text x="245" y="530" text-anchor="middle" class="node-title">持股</text>
  <text x="245" y="551" text-anchor="middle" class="node-code">hold[i-1]</text>
  <rect x="105" y="588" width="280" height="58" rx="11" class="node"/>
  <text x="245" y="613" text-anchor="middle" class="node-title">当天刚卖出</text>
  <text x="245" y="634" text-anchor="middle" class="node-code">sold[i-1]</text>
  <rect x="105" y="671" width="280" height="58" rx="11" class="node"/>
  <text x="245" y="696" text-anchor="middle" class="node-title">可买入的空仓</text>
  <text x="245" y="717" text-anchor="middle" class="node-code">rest[i-1]</text>

  <rect x="715" y="505" width="280" height="58" rx="11" class="node-orange"/>
  <text x="855" y="530" text-anchor="middle" class="node-title">持股</text>
  <text x="855" y="551" text-anchor="middle" class="node-code">hold[i]</text>
  <rect x="715" y="588" width="280" height="58" rx="11" class="node"/>
  <text x="855" y="613" text-anchor="middle" class="node-title">当天刚卖出</text>
  <text x="855" y="634" text-anchor="middle" class="node-code">sold[i]</text>
  <rect x="715" y="671" width="280" height="58" rx="11" class="node"/>
  <text x="855" y="696" text-anchor="middle" class="node-title">可买入的空仓</text>
  <text x="855" y="717" text-anchor="middle" class="node-code">rest[i]</text>

  <path d="M 385 526 C 505 500, 595 500, 715 526" class="edge-orange"/>
  <text x="550" y="503" text-anchor="middle" class="label-orange">继续持有</text>
  <path d="M 385 548 C 505 558, 595 600, 715 610" class="edge"/>
  <text x="535" y="573" text-anchor="middle" class="label">卖出：+prices[i]</text>
  <path d="M 385 696 C 505 650, 595 565, 715 542" class="edge-orange"/>
  <text x="528" y="647" text-anchor="middle" class="label-orange">买入：−prices[i]</text>
  <path d="M 385 617 C 510 630, 590 684, 715 696" class="edge"/>
  <text x="525" y="670" text-anchor="middle" class="label">冷冻一天</text>
  <path d="M 385 716 C 500 745, 600 745, 715 716" class="edge"/>
  <text x="550" y="746" text-anchor="middle" class="label">继续空仓</text>

  <text x="600" y="792" text-anchor="middle" class="strong">写当前状态时，只汇总所有指向它的合法入边。</text>
</svg>
