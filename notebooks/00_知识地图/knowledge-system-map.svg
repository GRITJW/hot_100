<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">AI 算法与工程知识体系地图</title>
  <desc id="desc">按稳定底座、通用 AI 能力、专业方向、产出沉淀组织的知识体系，其中大模型按核心算法层、系统层、应用层三层理解。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 42px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 22px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #536176; }
      .section-title { font: 700 27px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .label { font: 700 22px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .small { font: 400 17px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #455064; }
      .tiny { font: 400 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #5a6578; }
      .note { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #31435f; }
      .card { stroke: #d7deea; stroke-width: 2; rx: 18; }
      .soft { fill: #ffffff; }
      .base { fill: #eaf1ff; stroke: #9ab7f4; }
      .math { fill: #e9f8f0; stroke: #8dcea8; }
      .code { fill: #fff3df; stroke: #e8b86a; }
      .algo { fill: #f3ecff; stroke: #b7a0ec; }
      .ai { fill: #e8fbff; stroke: #7dc8d8; }
      .rec { fill: #fff0f3; stroke: #e89bad; }
      .llm { fill: #eef2ff; stroke: #8b9df2; }
      .multi { fill: #f0fbef; stroke: #88c979; }
      .output { fill: #f9f5ea; stroke: #d7bd78; }
      .llm-core { fill: #e8edff; stroke: #7083e0; }
      .llm-system { fill: #e8f7ff; stroke: #62afd3; }
      .llm-app { fill: #fff1e6; stroke: #e79a5e; }
      .arrow { stroke: #8a95a8; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrow-strong { stroke: #5468d4; stroke-width: 4; fill: none; marker-end: url(#arrowStrong); }
      .dash { stroke-dasharray: 9 9; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#8a95a8"/>
    </marker>
    <marker id="arrowStrong" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#5468d4"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#24344d" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1050"/>
  <text class="title" x="80" y="82">AI 算法与工程知识体系地图</text>
  <text class="subtitle" x="80" y="122">用一张图表达：先打稳定底座，再掌握通用 AI 能力，最后进入推荐、大模型、多模态，并把项目与论文沉淀为输出。</text>

  <rect class="card soft" filter="url(#shadow)" x="60" y="165" width="360" height="660"/>
  <text class="section-title" x="95" y="220">稳定底座</text>
  <text class="small" x="95" y="252">长期不变，支撑所有上层方向</text>

  <rect class="card base" x="92" y="290" width="296" height="88"/>
  <text class="label" x="118" y="325">01 计算机系统基础</text>
  <text class="tiny" x="118" y="354">硬件 / 操作系统 / 网络 / 数据库 / 分布式</text>

  <rect class="card math" x="92" y="406" width="296" height="88"/>
  <text class="label" x="118" y="441">02 数学统计优化</text>
  <text class="tiny" x="118" y="470">线代 / 概率 / 信息论 / 优化 / 强化学习</text>

  <rect class="card code" x="92" y="522" width="296" height="88"/>
  <text class="label" x="118" y="557">03 编程与工程能力</text>
  <text class="tiny" x="118" y="586">Python / Linux / Git / 软件工程 / 数据工程</text>

  <rect class="card algo" x="92" y="638" width="296" height="88"/>
  <text class="label" x="118" y="673">04 数据结构与算法</text>
  <text class="tiny" x="118" y="702">数据结构 / 算法思想 / 算法工具 / 题型归纳</text>

  <rect class="card soft" filter="url(#shadow)" x="475" y="230" width="335" height="300"/>
  <text class="section-title" x="510" y="285">通用 AI 能力</text>
  <text class="small" x="510" y="317">从传统机器学习走向深度学习</text>
  <rect class="card ai" x="510" y="355" width="265" height="68"/>
  <text class="label" x="533" y="386">05 机器学习基础</text>
  <text class="tiny" x="533" y="410">监督 / 无监督 / 特征工程 / 经典模型</text>
  <rect class="card ai" x="510" y="446" width="265" height="68"/>
  <text class="label" x="533" y="477">06 深度学习与 PyTorch</text>
  <text class="tiny" x="533" y="501">神经网络 / Transformer / 训练工程</text>

  <rect class="card soft" filter="url(#shadow)" x="855" y="165" width="655" height="660"/>
  <text class="section-title" x="895" y="220">专业方向</text>
  <text class="small" x="895" y="252">方向可交叉，但各自有清晰主问题</text>

  <rect class="card rec" x="895" y="290" width="555" height="86"/>
  <text class="label" x="925" y="326">07 推荐搜索广告</text>
  <text class="tiny" x="925" y="354">召回 → 粗排/精排 → 重排 → 业务系统 → 搜索与广告</text>

  <rect class="card llm" x="895" y="410" width="555" height="265"/>
  <text class="label" x="925" y="446">08 大模型</text>
  <text class="tiny" x="925" y="474">最大目录：按“模型怎么来 / 怎么跑 / 怎么用”拆三层</text>

  <rect class="card llm-core" x="925" y="502" width="155" height="112"/>
  <text class="note" x="945" y="535">核心算法层</text>
  <text class="tiny" x="945" y="564">模型怎么来</text>
  <text class="tiny" x="945" y="588">预训练 / 后训练</text>

  <rect class="card llm-system" x="1110" y="502" width="155" height="112"/>
  <text class="note" x="1130" y="535">系统层</text>
  <text class="tiny" x="1130" y="564">模型怎么跑</text>
  <text class="tiny" x="1130" y="588">训练 / 推理 / 服务</text>

  <rect class="card llm-app" x="1295" y="502" width="125" height="112"/>
  <text class="note" x="1315" y="535">应用层</text>
  <text class="tiny" x="1315" y="564">模型怎么用</text>
  <text class="tiny" x="1315" y="588">RAG / Agent</text>

  <path class="arrow-strong" d="M1083 558 C1090 558 1096 558 1106 558"/>
  <path class="arrow-strong" d="M1268 558 C1275 558 1282 558 1292 558"/>

  <rect class="card multi" x="895" y="705" width="555" height="86"/>
  <text class="label" x="925" y="741">09 多模态</text>
  <text class="tiny" x="925" y="769">模态编码 → 跨模态对齐 → VLM → 多模态生成 → 场景应用</text>

  <rect class="card output" filter="url(#shadow)" x="260" y="865" width="1080" height="105"/>
  <text class="section-title" x="302" y="918">产出沉淀：10 项目实验与面试 / 11 论文精读</text>
  <text class="small" x="302" y="950">把学习变成可复用材料：项目复盘、实验记录、面试题、手撕题、论文卡片、简历素材。</text>

  <path class="arrow" d="M420 492 C445 492 448 380 475 380"/>
  <path class="arrow" d="M810 380 C835 380 845 333 892 333"/>
  <path class="arrow-strong" d="M810 410 C838 410 850 543 892 543"/>
  <path class="arrow" d="M810 440 C835 440 848 748 892 748"/>
  <path class="arrow dash" d="M1173 675 C1173 690 1173 692 1173 702"/>
  <path class="arrow" d="M1173 825 C1173 845 1115 850 1085 865"/>
  <path class="arrow" d="M642 530 C642 748 565 812 565 862"/>
  <path class="arrow" d="M240 825 C240 845 278 848 318 865"/>

  <rect class="card soft" x="475" y="575" width="335" height="190"/>
  <text class="section-title" x="510" y="628">交叉理解</text>
  <text class="small" x="510" y="664">推荐 × 大模型：生成式推荐、推荐大模型</text>
  <text class="small" x="510" y="698">多模态 × 推荐：内容理解、短视频建模</text>
  <text class="small" x="510" y="732">大模型 × 应用：RAG、Tool Calling、Agent</text>

  <path class="arrow dash" d="M810 655 C835 655 855 595 895 595"/>
  <path class="arrow dash" d="M895 748 C850 748 835 715 810 715"/>

  <text class="tiny" x="80" y="1012">读图方式：先问一个概念解决什么问题。改模型能力 → 核心算法层；改运行效率 → 系统层；改使用方式和任务流程 → 应用层。</text>
</svg>
